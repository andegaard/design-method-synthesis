schema_version = "1.4"

artifacts = ["/app/output/design_report.json", "/app/output/findings.md"]

[task]
name = "afterquery/design-method-synthesis"
description = "A spring-loaded latch mechanism's energy-storage subsystem must be carried through a complete design methodology, end to end: score a morphological chart of sub-function variants under pairwise incompatibility rules to select a concept, which also fixes which material and end-fixation the later stages must use; apply Suh's Axiomatic Design -- the Independence Axiom, then the Information Axiom -- to select an embodiment among candidates that include a fully-coupled design with deceptively tight process data; derive a constrained nonlinear parametric-optimization problem spanning three engineering disciplines -- structural/fatigue spring design, particulate metal-matrix composite micromechanics, and spring-surge vibration -- from physical principles that are named but never reduced to equations in either the instructions or the data (the Wahl stress-concentration factor, the spring-rate relation, a Goodman-style linear fatigue criterion, Turner's CTE-homogenization model, a rule-of-mixtures density relation, and a fixed-fixed spring-surge natural-frequency relation are each named and their governing quantities given, with the closed form left for the solver's own domain knowledge to supply) against this latch's own requirements -- static stress, force delivery, housing and manufacturability limits, a temperature-derated fatigue-damage criterion carrying a constituent-CTE-mismatch thermal residual stress (via a stated constrained-mismatch estimate and a von Mises shear-equivalent conversion, the one relation still given explicitly because no single standard textbook form exists for it), a lateral-buckling slenderness limit, a fundamental-natural-frequency floor against spring surge, and a process-robustness re-check of fatigue, buckling, and frequency margin against manufacturing-tolerance noise whose magnitude is never restated here -- it must be recovered from the robust-design stage's own raw per-run measurements, reused a second time for a purpose that stage's own data never states -- and solve it, across both wire-treatment options, for the global minimum-cost spring geometry, then separately solve a second, genuinely competing optimization for the maximum-natural-frequency design under a relative cost cap, for this alternative alone choosing and justifying which of two given fatigue-life criteria (an infinite-life endurance limit or a finite-life criterion pinned to a stated rated cycle count) governs it -- a genuine engineering judgment call with no single correct answer, not a computation -- and determine whether the resulting design is actually different from the minimum-cost one; run a Taguchi L9 robust-design experiment under three named noise conditions and determine whether the factor-level combination that maximizes signal-to-noise is the same one that minimizes quality loss against a stated target spring rate; and screen twelve catalog-constrained final candidates -- some that satisfy every static requirement yet fail only the process-robustness re-check of fatigue once the composite's own residual stress and the recovered noise are correctly included, one an easy-to-miss infeasible near-miss, one feasible but dominated, one whose large active-coil count fails the force-delivery floor and the buckling limit together (not independently), and one that fails only the process-robustness re-check of the frequency-margin floor despite comfortably clearing it at nominal dimensions -- against three simultaneously competing objectives (cost, durability, and dynamic margin) with Pareto dominance, TOPSIS, and the weighted-sum method under stated unequal weights, recognizing and resolving a genuine disagreement between the two multi-criteria methods on this dataset."
authors = [{ name = "Anders Gaard", email = "andegaard@gmail.com" }]
keywords = ["morphological-analysis", "axiomatic-design", "constrained-optimization", "taguchi-method", "multi-criteria-decision-making", "mechanical-design", "design-theory"]

[metadata]
author_name = "Anders Gaard"
author_email = "andegaard@gmail.com"
author_organization = "Gaard Consulting"
author_profile = "https://github.com/andegaard"
conflicts_of_interest = "None"

difficulty_explanation = "All data in this task -- the morphological chart, the three FR-DP embodiment candidates, the spring physics problem, the Taguchi array, and the twelve final candidates -- is synthetic, authored from scratch for this task rather than drawn from any published case study, catalog, or textbook problem instance. It is nonetheless physically realistic: every numeric value corresponds to a dimensionally and physically plausible small helical compression spring, material, and manufacturing tolerance, and the parametric-optimization stage's constraint set was independently confirmed, not assumed, to admit a genuine, well-posed global optimum by multistart nonlinear solves cross-checked with differential evolution. A mechanical design engineer carrying a new spring-loaded subsystem from concept through production release at a product-development or components-manufacturing organization -- or a consulting design engineer serving one -- performs essentially this sequence as a matter of course: concept screening, embodiment selection under a coupling/information-theoretic axiom, first-principles sizing against a full static/fatigue/stability/dynamic requirement set spanning three disciplines a generalist does not automatically hold at expert depth at once, tolerance-robustness screening, and multi-criteria selection among supplier-catalog options under competing objectives; chaining exactly these five methods on one coherent subsystem is standard structured-design practice, not an artificial testbed built around trap language. Critically, neither `instruction.md` nor the data file reduces any of the standard governing relations to a written-out equation: the Wahl stress-concentration factor, the spring-rate relation, the peak-shear-stress relation, the linear (Goodman-style) fatigue-damage criterion, Turner's CTE-homogenization model, the rule-of-mixtures density relation, the fixed-fixed spring-surge natural-frequency relation, Suh's Information Axiom, and the Taguchi signal-to-noise and quadratic-loss formulas are each named, with the physical quantities they depend on given, but their closed forms are not -- a solver that does not already command these relations at a domain-expert level, or cannot correctly re-derive them, cannot proceed by substituting into a given equation. (The two relations still given explicitly -- the composite's constrained-mismatch thermal-residual-stress estimate and the free-length/buckling geometry -- are not standard-named textbook formulas a reference would supply verbatim, so withholding them would make the task depend on guessing among several defensible variants rather than on genuine expertise; they stay stated so the task remains well-posed.) The difficulty is intrinsic to the engineering content at every stage: morphological analysis requires correctly applying five pairwise incompatibility rules across a 4x(3-4) chart before scoring; Axiomatic Design's Independence Axiom must be applied before the Information Axiom, since one candidate embodiment is fully coupled yet has the tightest process-capability data of the three; the parametric-optimization stage hands over no ready-made constraint set and no equations -- it names the governing relations, a three-row material-property table whose rows are two-phase particulate metal-matrix composite wire systems (each specifying its matrix and reinforcement phases' own CTE, bulk modulus, mass density, and, for the matrix, Young's modulus, rather than a single already-homogenized number), a three-row end-fixation-keyed buckling-limit table, and a two-row wire-treatment table, keyed to choices the concept-selection stage already made; correctly sizing the spring additionally requires deriving the composite's effective CTE from Turner's homogenization model, its constituent-CTE-mismatch thermal residual stress (converted from a normal to a shear-equivalent stress by the von Mises relation), and its homogenized mass density -- materials-science derivations genuinely coupled into the mechanical sizing and dynamic-response problem, not decorative extra calculations, since the residual stress measurably shifts which constraints bind at the true optimum and the density feeds a fundamental-natural-frequency floor against spring surge that pulls the design in the opposite direction from the buckling limit; both wire-treatment options must actually be solved and compared, not picked by inspection; the selected material's own strength properties are not given as a single number either -- they must be read off a tempering-response table by tempering temperature, excluding two conditions that fail a stated minimum Charpy toughness (one the highest-strength condition outright, the other inside a classical tempered-martensite-embrittlement band where toughness dips even though strength is not at its lowest) before searching the remaining conditions jointly with the wire-treatment choice for the true minimum-cost combination; a feasible design must additionally survive the same wire-diameter/active-coil manufacturing-tolerance noise the robust-design (Taguchi) stage already characterizes for this same spring family, but that noise's magnitude is never restated in the parametric-optimization data -- it exists only as an emergent property of the Taguchi stage's own raw, per-run, per-noise-condition spring-rate measurements -- and depends on the forming-setup factor E the robust-design stage must recommend -- recoverable only by inverting the standard spring-rate relation against them, and the three requirements it re-checks (fatigue, buckling, frequency margin) do not all fail in the same perturbation direction, so identifying each one's actual worst case is itself a piece of engineering reasoning, not a lookup; at the true global optimum this re-check is not slack decoration -- it is the process-robustness re-check of fatigue, not the nominal fatigue check itself, that ends up essentially exactly binding once the composite residual stress is included; a separate, genuinely competing second optimization -- the maximum-natural-frequency design achievable under a relative cost cap -- must also be solved and checked for whether it differs from the minimum-cost design, and on this data the cost cap itself turns out not to be the binding limit, a result that requires actually solving rather than assuming; for this alternative design alone, and only after it is solved, choosing which of two given fatigue-life criteria governs it -- the same infinite-life endurance limit the minimum-cost design always uses, or a finite-life criterion pinned to a stated rated qualification cycle count -- is a genuine engineering judgment call with no single correct answer, deliberately not reducible to a computation, that a correct solution must make and justify rather than compute; the two choices lead to two different, well-separated designs on this data (a lower-cost, higher-frequency design under the less-conservative finite-life criterion, whose own binding limit shifts from the fatigue process-robustness re-check to the static stress limit), so an arbitrary or unjustified choice is detectable even though either well-justified choice is graded as correct; the process-robustness re-checks of fatigue, buckling, and frequency margin, most of them slack at the global optimum itself, become the sole binding reason several different final candidates are infeasible even though each would otherwise look straightforwardly acceptable or even attractive on the requirements a coarser screen would check, so screening the final candidates requires identifying which of several distinct requirements -- static, fatigue (including the composite residual stress), buckling, frequency margin, or one of their three process-robustness re-checks -- is actually limiting each one, sometimes more than one at once; the Taguchi stage requires computing signal-to-noise ratios from raw per-noise-condition measurements and separately evaluating quality loss against a stated target, then explicitly checking -- not assuming -- whether the two resulting factor-level combinations coincide (on this data, they do not); and the final multi-criteria stage now screens three simultaneously competing objectives (cost, durability, dynamic margin) with stated unequal weights, where TOPSIS and the weighted-sum method genuinely disagree on the winning candidate -- not merely tie -- so a correct solution must recognize the disagreement, understand why it arises (unequal per-criterion weighting lets min-max-normalized linear scalarization reward a candidate extreme on the two most heavily weighted objectives over one that TOPSIS's joint geometric-distance metric ranks higher for being balanced across all three), and make and justify a reasoned choice rather than mechanically reporting one formula's output. A correct solution must also synthesize all five stages into one coherent, internally cross-referenced narrative -- including carrying the concept-selection stage's material and end-fixation choice into the parametric-optimization and final-selection stages correctly -- rather than reporting five disconnected numbers. Given this combination of first-principles derivation spanning three engineering disciplines (structural/mechanical spring design, composite-materials micromechanics, and structural dynamics/vibration) with no governing equation handed over for any of the standard relations, a genuine two-branch treatment trade-off and a second genuinely competing optimization each requiring full constrained nonlinear solves, a process-robustness noise magnitude that must be reverse-engineered from an earlier stage's own raw data rather than looked up, a genuine engineering judgment call with no computed answer that a correct solution must make and defend rather than solve for, cross-stage state-tracking across all of the above, and an unresolved-by-either-method final decision among three objectives, a domain expert (a professor of mechanical design with years of applied design, composite-materials, and vibration experience) authoring and independently verifying this task -- deriving the physics of all three disciplines from scratch, tuning the numeric requirements so every trap is genuine rather than contrived, and independently re-solving every stage (including both branches of the judgment call, confirming the grading accepts either one self-consistently) to confirm a unique, well-posed answer -- should expect to spend more than five full working days on it, well beyond what a recent mechanical engineering master's graduate would need for any single stage in isolation."

solution_explanation = "Direct combinatorial enumeration of the morphological chart with pairwise-exclusion filtering, which also fixes the material (D3) and end-fixation (C3) rows the later stages must use; coupling classification of each FR-DP sensitivity matrix by testing whether some permutation makes it lower-triangular, followed by Information Axiom comparison (via the standard normal CDF) restricted to the Independence-compliant candidates; supplying and applying the Wahl stress-concentration factor and the standard helical-spring peak-stress and spring-rate relations from domain knowledge, since the data file only names them; deriving the selected material's effective coefficient of thermal expansion from its matrix and reinforcement phases via Turner's homogenization model (likewise supplied from domain knowledge), its thermal residual shear stress from the same two phases' CTE mismatch on cooldown from processing temperature (the one relation given explicitly, converted to a shear-equivalent by the von Mises relation), and its homogenized mass density via the rule of mixtures; deriving eleven constraint functions (static shear stress, minimum and maximum force delivered, housing clearance, spring-index manufacturability, a linear Goodman-style fatigue-damage criterion using temperature-derated and treatment-adjusted strengths with the composite residual stress added to the mean-stress term, a free-length/mean-diameter buckling-slenderness limit, a fixed-fixed spring-surge fundamental-natural-frequency floor built on the composite's own density, and process-robustness re-checks of the fatigue, buckling, and frequency-margin requirements at whichever perturbation direction is actually worst-case for each) from the named physical relations, the selected material row, and the selected end-fixation row; recovering the process-robustness perturbation magnitudes themselves (not stated anywhere in the parametric-optimization data) by fitting the standard spring-rate relation to taguchi_spring_robustness.csv's raw per-run, per-condition measurements via nonlinear least squares, restricted to the runs at the forming-setup (factor E) level the Taguchi stage recommends -- the offsets scale with E (x1.0/x1.5/x2.0), so a fit pooled over all runs, or one taken at the on-target run's looser setup, gives the wrong noise and fails different downstream checks (the setup's own recommendation, and hence the noise, comes from the robust-design stage's signal-to-noise response table, making that stage's selection feed the parametric and final-selection stages); excluding the two tempering conditions in the selected material's tempering-response table that fail a stated minimum Charpy toughness (one the lowest-temper, highest-strength condition, the other inside this alloy's tempered-martensite-embrittlement band, where toughness dips even though temper temperature is not at its lowest) before ever solving a sizing problem for either; then a differential-evolution feasibility search warm-starting a bounded trust-constr refinement of the resulting helical-spring sizing problem for each toughness-passing tempering condition crossed with each of the two wire-treatment options, cross-checked by a second, genuinely independent differential-evolution solve of the actual cost objective, taking the cheapest feasible (tempering condition, treatment) pair as the global optimum (the same tempering condition that reproduces this material's original, single-value strength properties, combined with shot peening, wins on this data, despite peening's 20% per-volume cost premium, because the fatigue margin it buys -- including headroom against the residual-stress penalty and its own process-robustness re-check -- allows a materially smaller, cheaper-overall spring); then separately re-solving a second, genuinely different optimization -- maximizing the same natural-frequency relation subject to every other requirement (process-robustness included, except the frequency floor's own) and a 1.15x cost cap on the minimum-cost design's own cost -- for this alternative alone choosing, and justifying, which of the two given fatigue criteria governs it (a genuine engineering judgment call with no computed answer: the finite-life Basquin criterion, pinned to a stated rated qualification cycle count, is the defensible choice precisely when that stated rating rather than unbounded service life is what a performance-oriented alternative is actually being qualified against, and is the choice the reference solution makes and justifies on that basis, though the infinite-life choice is graded as equally correct if consistently applied and justified) -- and confirming it lands on a different geometry whose binding limits are the housing bore, the force-delivery cap, and (for the infinite-life choice) the fatigue process-robustness re-check, or (for the finite-life choice) the static stress limit instead, never the cost cap itself; Taguchi analysis of the L9 array (nominal-the-best signal-to-noise ratio per run, factor-level response-table averaging to find the most robust combination, using the reference shear modulus G = 80000 N/mm^2 stated for this robustness study) plus a separate quality-loss evaluation of every run against a stated target and loss coefficient; and multi-objective screening of the twelve final candidates by re-deriving and re-checking every one of the eleven requirements (nominal and process-robustness alike) per candidate's own listed wire treatment, rather than reusing the optimization stage's own design, Pareto-dominance filtering under three simultaneous objectives -- cost, durability (Na), and dynamic (frequency) margin -- (four of the five feasible candidates are non-dominated), and both TOPSIS (vector-normalized) and the weighted-sum method (min-max normalized), with unequal weights of 0.45 cost / 0.35 durability / 0.20 frequency margin -- which disagree on this Pareto front's winner: the weighted-sum method favors the candidate closer to the middle of the cost/durability/margin trade-off, while TOPSIS favors the highest-durability candidate despite its higher cost and lower margin, because its geometric-distance metric weighs standing on all three normalized objectives jointly rather than crediting strength on two axes independently of a weakness on the third; resolved by taking TOPSIS's winner and explaining why. All five results are combined into a single cross-referenced synthesis."

verification_explanation = "The verifier reads only /app/output/design_report.json and findings.md and runs 36 checks (pytest, reported via CTRF at /logs/verifier/ctrf.json) against sealed ground truth in tests/ground_truth.json, with every numeric tolerance chosen deliberately rather than left to a default: morphological totals, best combination, and score are checked exactly (integers, no tolerance needed); axiomatic coupling classification is checked exactly for all three designs, with a dedicated test confirming the coupled design's information content is never even computed, and information-content values are checked to within 0.01 bits (an order of magnitude tighter than the 0.14-bit gap between the two compliant candidates in this dataset, so the tolerance cannot itself decide the winner); the parametric optimum's cost is checked within a 2% relative tolerance (wide enough to absorb multistart-seed-level solver noise -- independent re-solves agree to about 1e-4% -- but far too tight to accept a design that used the wrong material row, end-fixation row, wire treatment, tempering condition, an incorrectly-recalled governing relation, or an omitted composite thermal residual stress, any of which shifts the cost by several percent or more) and its reported wire treatment and tempering condition are each checked exactly, with a dedicated further check that independently looks up whichever tempering condition the report names in a hardcoded copy of the tempering-response table and confirms it actually clears the stated minimum Charpy toughness -- catching a report that names a plausible-looking but wrong (trap) condition even where its cost happens to land close to the sealed value -- plus an independent recomputation of all eleven derived requirement functions -- five static/geometric, fatigue, buckling, the frequency floor, and process-robustness re-checks of fatigue, buckling, and frequency margin at their own independently-determined worst-case perturbation directions -- from the agent's own reported (d, D, Na, treatment) with a slack tolerance of 0.02 -- far looser than the sealed optimum's own tightest active margins (the oversupply cap and the fatigue process-robustness re-check are essentially exactly binding there, at ~1e-8 and ~1e-10 respectively, a property of the true continuous optimum, not a reporting requirement), and sized to absorb ordinary reporting-precision rounding (verified: rounding the reported design to four decimal places of a millimetre shifts the tightest margins by no more than about 0.009) while still failing a materially wrong, infeasible design (a wrong wire treatment or a half-percent error in wire diameter both produce violations an order of magnitude or more above this tolerance), confirming genuine feasibility, nominal and under manufacturing-tolerance noise alike, rather than a plausible-looking cost; the composite wire's Turner-model effective CTE is checked against the sealed value within an absolute tolerance of 1e-7 per degree C (about 1% relative), its homogenized density within 0.1 kg/m^3, and its fundamental natural frequency within a 2% relative tolerance, each cross-checked against an independent from-constituent-data recomputation, so a value close to the sealed number that was not actually derived from the matrix/reinforcement properties still fails; the frequency-optimized alternative design's own natural frequency, cost, feasibility against every non-frequency requirement, compliance with the 1.15x cost cap, and its differs-from-the-cost-optimum flag are each checked the same way, self-consistently against whichever of the two fatigue-life criteria the report's own frequency_alternative_fatigue_philosophy field claims to use -- since that choice is a genuine judgment call with two separately sealed targets rather than one fixed answer, and this self-consistent grading was directly verified by constructing a second report claiming the opposite philosophy with its own matching numbers and confirming it also passes every check; Taguchi signal-to-noise ratios are checked within 0.05 dB and factor-level averages within 0.10 dB (both well under the smallest genuine factor-level effect in this dataset, about 0.6 dB for factor B, so rounding cannot be mistaken for a real effect), the most-robust combination's predicted spring rate within 0.02 N/mm and quality-loss values within 0.05, the best-on-target run, and a dedicated check that the report correctly flags the two combinations as different; final-candidate feasibility under every requirement including fatigue (with the residual-stress term), buckling, the frequency-margin floor, and all three process-robustness re-checks, at the same 1e-6 numerical tolerance instruction.md itself now states (several candidates sit essentially exactly on a binding constraint, well within that tolerance) (a report that accepts any infeasible candidate, or fails to exclude the dominated one, fails outright), the three-objective Pareto-optimal set, the TOPSIS and weighted-sum winners individually under the stated unequal weights, and a dedicated check that when they disagree the written explanation says so explicitly; cross-field consistency checks that the synthesis section reuses each stage's own already-graded results (with the final-design field constrained to be whichever of the two multi-criteria winners the report itself settled on, not a third value) rather than inventing a second answer; a keyword/length check on the written explanation covering all five stages plus the treatment, buckling, frequency-margin, composite-CTE/residual-stress, and fatigue-life-philosophy elements; and a check that findings.md mentions all five stages by name. Eight checks independently re-derive their stage's key result directly from a copy of the raw data file shipped to the verifier or from constituent material properties, tempering-response data, and requirement constants hardcoded independently of the agent's report, using only the Python standard library (including an erf-based normal CDF in place of scipy.stats.norm, since the verifier image installs no scientific-computing packages), so a hardcoded or memorized answer that happens to match the sealed value by coincidence will not also match an independent from-data recomputation -- and, because no closed-form equation for these relations is given anywhere in the task, a match against this independent recomputation is only reachable by actually supplying the correct governing physics, not by copying a formula out of the prompt."

